# Telegraf configuration for scraping the gopowerwall proxy's JSON API and
# writing it to InfluxDB. Endpoints are taken from proxy/routes.go.
#
# IMPORTANT - Tesla Cloud / FleetAPI mode data caveat:
# Tesla's cloud API exposes no per-device vitals. In cloud/FleetAPI mode,
# /vitals, /strings, /temps and /alerts return empty or stub data
# (backend/cloud and backend/fleetapi's Vitals() return an empty map, and
# several /api/* endpoints are served from backend/stubs). This is an
# upstream Tesla limitation shared with pypowerwall, not a gopowerwall bug.
# Only aggregate power (/aggregates, /json), SOE, and grid status
# (/api/system_status/*) are real in cloud/FleetAPI mode. Local/TEDAPI mode
# talking directly to the Gateway on the LAN does not have this limitation.
# The [[inputs.http]] blocks below for vitals/strings/temps/alerts are still
# included so panels are ready to populate if you ever run in local mode
# against the Gateway directly - expect them to stay flat in cloud mode.

[global_tags]

[agent]
  interval = "30s"
  round_interval = true
  flush_interval = "30s"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# --- Real data in every mode (local, TEDAPI, cloud, FleetAPI) -------------

# /json: one-shot summary - grid/home/solar/battery power, SOE, grid status,
# backup reserve, time remaining, and pack energy.
[[inputs.http]]
  name_override = "powerwall_summary"
  urls = ["${POWERWALL_URL}/json"]
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "grid"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "home"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "solar"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "battery"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "soe"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "grid_status"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "reserve"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "time_remaining_hours"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "full_pack_energy"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "energy_remaining"
      type = "float"

# /aggregates: instant power per meter (site/solar/battery/load), each with
# nested instant_power/energy fields.
[[inputs.http]]
  name_override = "powerwall_aggregates"
  urls = ["${POWERWALL_URL}/aggregates"]
  data_format = "json_v2"
  [[inputs.http.json_v2.object]]
    path = "@this"
    included_keys = [
      "site_instant_power", "solar_instant_power",
      "battery_instant_power", "load_instant_power",
    ]

# /api/system_status/soe: battery state of charge percentage.
[[inputs.http]]
  name_override = "powerwall_soe"
  urls = ["${POWERWALL_URL}/api/system_status/soe"]
  data_format = "json_v2"
  [[inputs.http.json_v2.field]]
    path = "percentage"
    type = "float"

# /api/system_status/grid_status: whether the site is grid-connected or
# islanded.
[[inputs.http]]
  name_override = "powerwall_grid_status"
  urls = ["${POWERWALL_URL}/api/system_status/grid_status"]
  data_format = "json_v2"
  [[inputs.http.json_v2.field]]
    path = "grid_status"
    type = "string"

# --- Proxy self-monitoring (always real, independent of connection mode) --

[[inputs.http]]
  name_override = "powerwall_proxy_stats"
  urls = ["${POWERWALL_URL}/stats"]
  data_format = "json_v2"
  [[inputs.http.json_v2.field]]
    path = "gets"
    type = "int"
  [[inputs.http.json_v2.field]]
    path = "errors"
    type = "int"
  [[inputs.http.json_v2.field]]
    path = "timeout"
    type = "int"
  [[inputs.http.json_v2.field]]
    path = "mode"
    type = "string"

# --- Device-level data: real on local/TEDAPI mode, stub/empty on cloud and
# --- FleetAPI mode. See the caveat at the top of this file. --------------

[[inputs.http]]
  name_override = "powerwall_vitals"
  urls = ["${POWERWALL_URL}/vitals"]
  data_format = "json_v2"
  [[inputs.http.json_v2.object]]
    path = "@this"

[[inputs.http]]
  name_override = "powerwall_strings"
  urls = ["${POWERWALL_URL}/strings"]
  data_format = "json_v2"
  [[inputs.http.json_v2.object]]
    path = "@this"

[[inputs.http]]
  name_override = "powerwall_temps"
  urls = ["${POWERWALL_URL}/temps"]
  data_format = "json_v2"
  [[inputs.http.json_v2.object]]
    path = "@this"

[[inputs.http]]
  name_override = "powerwall_alerts"
  urls = ["${POWERWALL_URL}/alerts"]
  data_format = "json_v2"
  [[inputs.http.json_v2.object]]
    path = "@this"
