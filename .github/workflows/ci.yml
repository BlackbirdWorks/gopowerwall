name: Pull Request CI

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  GH_CI_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Build-tagged files are excluded by default, which silently left the
          # whole of test/integration unlinted.
          args: --timeout 10m --build-tags=integration

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go vet (integration build tag)
        run: go vet -tags=integration ./test/integration/...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload govulncheck SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: 'autobuild'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '36.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12

      - name: Verify generated protobuf bindings are up to date
        run: |
          make proto
          if ! git diff --exit-code -- proto/; then
            echo "::error::Generated protobuf bindings are stale. Run 'make proto' and commit the result."
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run Unit Tests
        run: |
          COVERPKGS=$(go list ./... | grep -v -E '(/test/|/proto/)' | tr '\n' ',' | sed 's/,$//')
          go tool gotestsum --format pkgname -- \
            -race -shuffle on -short -timeout 5m \
            -coverpkg="$COVERPKGS" -coverprofile=unit-coverage.out -covermode=atomic \
            ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: unit-coverage.out
          retention-days: 1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ env.GH_CI_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run Integration Tests
        run: |
          if [ ! -d test/integration ]; then
            echo "No integration tests yet; skipping."
            echo "mode: atomic" > integration-coverage.out
            exit 0
          fi
          COVERPKGS=$(go list ./... | grep -v -E '(/test/|/proto/)' | tr '\n' ',' | sed 's/,$//')
          go tool gotestsum --format pkgname -- \
            -race -shuffle on -timeout 10m -tags=integration \
            -coverpkg="$COVERPKGS" -coverprofile=integration-coverage.out -covermode=atomic \
            ./test/integration/...

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: integration-coverage.out
          retention-days: 1

  coverage:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          merge-multiple: true

      - name: Merge coverage profiles
        run: |
          echo "mode: atomic" > coverage.out
          for f in *-coverage.out; do
            [ -f "$f" ] || continue
            tail -n +2 "$f" >> coverage.out
          done
          go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage threshold
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build static binaries
        run: make build-linux

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: gopowerwall-binaries
          path: bin/
          retention-days: 1
